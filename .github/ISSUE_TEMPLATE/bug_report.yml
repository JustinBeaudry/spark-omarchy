name: Bug report
description: Report a setup or compatibility problem without sharing private data
body:
  - type: markdown
    attributes:
      value: |
        Never paste callback URLs, codes/state/tokens, account addresses, mail,
        raw application logs, Wine prefixes, crash dumps or authenticated screenshots.
        Read CONTRIBUTING.md and SECURITY.md before sharing diagnostic output.
  - type: input
    id: versions
    attributes:
      label: Project, Wine and Omarchy/Arch versions
      description: Include the pinned Spark version and whether this was a fresh install.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Steps, expected behavior and visible error
      description: Use sanitized descriptions. For OAuth, give the provider and scheme name only.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed doctor output
      description: Optional output of spark-omarchy doctor --json. Review before sharing.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included authentication URLs/secrets, mail, raw logs, prefixes or dumps.
          required: true
